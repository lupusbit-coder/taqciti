name: Release

# ── O que a release entrega ──────────────────────────────────────────────────
#
# O ZIP DA EXTENSÃO, e só ele. Até 13/11/2026 a release compilava três
# instaladores nativos (Inno Setup no Windows, .pkg no macOS, makeself no
# Linux), montava um pacote com guia e os subia ao Drive do time. O usuário
# abandonou os instaladores: hoje quem instala pede a um assistente de IA
# (Claude, ChatGPT) que carregue a extensão no navegador, e o passo a passo
# manual está em INSTALL.md. Três runners, uma conta de serviço do Google e um
# pacote que ninguém mais abria saíram junto.
#
# Uma tag `vX.Y.Z` publica uma GitHub Release com o zip e o SHA-256 dele. Uma
# run disparada à mão só compila e deixa o zip como artefato da run.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# O endereço do servidor e o segredo compartilhado entram NO BUNDLE da
# extensão, na hora da build — não são lidos em runtime. Sem eles a build de
# produção é recusada pelo `vite.config.ts`, e `check-release-env.sh` diz qual
# falta antes de compilar. Foi o que fez os pacotes da v2.0.0 saírem apontando
# para localhost.
#
# Configurar em Settings → Secrets and variables → Actions:
#   Variables → DOCCITI_SERVER_URL   (a URL base do servidor em produção, sem "/" no fim)
#   Secrets   → DOCCITI_SHARED_KEY   (o mesmo valor da variável no servidor)
#
# Ver docs/publicar-release.md. O deploy do servidor é MANUAL: nada aqui o
# atualiza, então publique-o antes de cortar a tag.
env:
  VITE_DOCCITI_SERVER_URL: ${{ vars.DOCCITI_SERVER_URL }}
  VITE_DOCCITI_SHARED_KEY: ${{ secrets.DOCCITI_SHARED_KEY }}

# Só leitura por padrão; o passo de publicar pede escrita no próprio job.
permissions:
  contents: read

jobs:
  extensao:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Conferir configuração de release
        run: bash .github/scripts/check-release-env.sh

      - name: Resolver versão
        id: version
        run: bash .github/scripts/resolve-version.sh >> "$GITHUB_OUTPUT"

      # O zip leva a versão do package.json no nome (scripts/package-release.mjs).
      # Uma tag que diz outra coisa publicaria `v2.2.0` com um zip `v2.1.2`
      # dentro — e quem baixa não tem como saber qual é qual.
      - name: A tag e o package.json dizem a mesma versão
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ steps.version.outputs.version }}" ]; then
            echo "A versão resolvida (${{ steps.version.outputs.version }}) não é a do package.json ($pkg)." >&2
            echo "Ajuste o package.json antes de cortar a tag. Nada foi publicado." >&2
            exit 1
          fi

      # `npm run package` roda a build de produção e empacota dist/ em
      # release/taqciti-v<versão>.zip.
      - run: npm run package

      # A impressão digital do que foi publicado. O zip não é assinado; com
      # isto, quem baixa confere que o arquivo é o mesmo que o CI montou
      # (`Get-FileHash` no Windows, `shasum -a 256` no Mac).
      - name: Calcular SHA-256
        run: |
          set -euo pipefail
          ( cd release && sha256sum taqciti-v*.zip ) > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensao
          path: |
            release/taqciti-v*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      # Só uma tag publica. A condição não diz só "é um push": diz "é um push
      # DE TAG começando com v" — se um dia alguém acrescentar `branches:` ao
      # gatilho, um push de branch continua sem publicar nada.
      - name: Publicar GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/taqciti-v*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
